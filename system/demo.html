<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLUR Design System × slur-ux — Button 파일럿</title>
<link rel="stylesheet" href="./tokens/index.css">
<link rel="stylesheet" href="./components/button.css">
<style>
body { margin: 0; padding: var(--space-48) var(--space-40); background: var(--color-surface-sunken); font-family: var(--font-sans); color: var(--color-text-primary); transition: background-color var(--duration-base) var(--ease-standard); }
.page_demo { display: flex; width: 100%; max-width: 960px; margin: 0 auto; flex-direction: column; gap: var(--space-40); }
.p_head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-24); }
.p_section { display: flex; flex-direction: column; gap: var(--space-16); }
.p_section_title { margin: 0; padding-bottom: var(--space-8); border-bottom: 1px solid var(--color-border-subtle); font-size: var(--text-sm); font-weight: var(--weight-medium); letter-spacing: var(--tracking-wide); color: var(--color-text-muted); text-transform: uppercase; }
.p_row { display: flex; align-items: center; gap: var(--space-16); flex-wrap: wrap; }
.p_eyebrow { font-size: var(--text-xs); letter-spacing: var(--tracking-wide); color: var(--color-text-muted); text-transform: uppercase; }
.p_title { margin: 0; font-size: var(--text-4xl); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-tight); }
.p_desc { margin: 0; max-width: 56ch; font-size: var(--text-base); color: var(--color-text-secondary); }
</style>
</head>
<body>
<div class="page_demo">

  <header class="p_head">
    <div>
      <span class="p_eyebrow">SLUR Design System · slur-ux 파일럿</span>
      <h1 class="p_title">Button</h1>
      <p class="p_desc">클로드디자인의 Button을 slur-ux 문법(컴포넌트 클래스 + m_ 변형 + data-state)으로 변환한 버전. 값은 전부 시맨틱 토큰만 사용한다.</p>
    </div>
    <button type="button" class="btn" id="themeToggle">다크 모드</button>
  </header>

  <section class="p_section">
    <h2 class="p_section_title">종류</h2>
    <div class="p_row">
      <button type="button" class="btn m_primary">기본</button>
      <button type="button" class="btn">보조</button>
      <button type="button" class="btn m_ghost">고스트</button>
      <button type="button" class="btn m_danger">위험</button>
    </div>
  </section>

  <section class="p_section">
    <h2 class="p_section_title">크기</h2>
    <div class="p_row">
      <button type="button" class="btn m_primary m_small">작게 · 32</button>
      <button type="button" class="btn m_primary">보통 · 40</button>
      <button type="button" class="btn m_primary m_large">크게 · 48</button>
    </div>
  </section>

  <section class="p_section">
    <h2 class="p_section_title">아이콘 · 상태 · 전체 너비</h2>
    <div class="p_row">
      <button type="button" class="btn m_primary"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"></path></svg>새 항목</button>
      <button type="button" class="btn m_icon" aria-label="설정"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
      <button type="button" class="btn m_primary" disabled>비활성</button>
      <button type="button" class="btn m_primary" data-state="loading">저장 중...</button>
    </div>
    <button type="button" class="btn m_primary m_full">전체 너비 버튼</button>
  </section>

</div>
<script>
const toggle = document.getElementById("themeToggle");
toggle.addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.getAttribute("data-theme") === "dark";
  if (dark) { root.removeAttribute("data-theme"); } else { root.setAttribute("data-theme", "dark"); }
  toggle.textContent = dark ? "다크 모드" : "라이트 모드";
});
</script>
</body>
</html>
