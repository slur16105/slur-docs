<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 — SLUR 화면 조립본</title>
<!-- 테마 복원은 첫 페인트 전에(깜빡임 방지) — slur.js보다 먼저, head 인라인 한 줄 -->
<script>try{if(localStorage.getItem('theme')==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
<link rel="icon" href="../../brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../../../slur-guidelines/assets/global.css">
<link rel="stylesheet" href="../../tokens/colors.css">
<link rel="stylesheet" href="../../tokens/typography.css">
<link rel="stylesheet" href="../../tokens/spacing.css">
<link rel="stylesheet" href="../../tokens/radius.css">
<link rel="stylesheet" href="../../tokens/shadows.css">
<link rel="stylesheet" href="../../tokens/motion.css">
<link rel="stylesheet" href="../../tokens/breakpoints.css">
<link rel="stylesheet" href="../../tokens/z-index.css">
<link rel="stylesheet" href="../../components/button.css">
<link rel="stylesheet" href="../../components/input.css">
<link rel="stylesheet" href="../../components/selection.css">
<link rel="stylesheet" href="../../components/alert.css">
<link rel="stylesheet" href="../../components/state.css">
<link rel="stylesheet" href="../../components/toast.css">
<link rel="stylesheet" href="../auth-shell.css">
<script src="../../../../slur-guidelines/assets/slur.js" defer></script>
<style>
/* 페이지 CSS — 폼 조합. 구조 간격은 px, 텍스트 간격은 rem 토큰 */
.page_login { display: flex; flex-direction: column; gap: 24px; }
.page_login .p_head { display: flex; flex-direction: column; gap: var(--space-4); }
.page_login .p_title { font-size: var(--text-2xl); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-snug); }
.page_login .p_desc { font-size: var(--text-sm); color: var(--color-text-secondary); }
.page_login .alert[data-state="close"] { display: none; }
.page_login .p_form { display: flex; flex-direction: column; gap: 16px; }
.page_login .p_label_row { display: flex; align-items: center; justify-content: space-between; }
.page_login .p_link { font-size: var(--text-sm); color: var(--color-text-brand); text-decoration: none; }
.page_login .p_link:hover { text-decoration: underline; }
.page_login .i_help:empty { display: none; }
.page_login .p_divider { display: flex; align-items: center; gap: var(--space-12); font-size: var(--text-xs); color: var(--color-text-muted); }
.page_login .p_divider::before, .page_login .p_divider::after { content: ""; height: 1px; background: var(--color-border-subtle); flex: 1; }
.page_login .p_social { display: flex; flex-direction: column; gap: 8px; }
.page_login .p_signup { font-size: var(--text-sm); color: var(--color-text-secondary); text-align: center; }
.page_login .p_signup a { font-weight: var(--weight-medium); color: var(--color-text-brand); text-decoration: none; }
.page_login .p_signup a:hover { text-decoration: underline; }
</style>
</head>
<body>

<div class="layout_auth">
  <a class="l_brand" href="#"><span class="l_logo" role="img" aria-label="SLUR"><img class="l_logo_light" src="../../brand/logo.svg" alt=""><img class="l_logo_dark" src="../../brand/logo-white.svg" alt=""></span></a>

  <main class="l_main">
    <div class="l_card">
      <div class="page_login">
        <div class="p_head">
          <h1 class="p_title">로그인</h1>
          <p class="p_desc">워크스페이스에 들어가려면 계정으로 로그인하세요. (데모: demo@slur.co.kr / password)</p>
        </div>

        <!-- 폼 전체 실패(자격 증명 오류)는 폼 상단 인라인 alert — role=alert, 제출 결과에만 표시 -->
        <div class="alert m_inline m_danger" role="alert" data-state="close">
          <span class="i_icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v4M12 16h.01"></path></svg></span>
          <span class="i_text">이메일 또는 비밀번호가 올바르지 않습니다.</span>
        </div>

        <form class="p_form" novalidate>
          <div class="field">
            <label class="i_label" for="login_email">이메일</label>
            <input class="input_text m_large" type="email" id="login_email" name="email" autocomplete="username" placeholder="you@example.com" required aria-describedby="login_email_help">
            <span class="i_help" id="login_email_help"></span>
          </div>
          <div class="field">
            <div class="p_label_row"><label class="i_label" for="login_pw">비밀번호</label><a class="p_link" href="#">비밀번호를 잊으셨나요?</a></div>
            <div class="input_wrap">
              <input class="input_text m_large m_icon_right" type="password" id="login_pw" name="password" autocomplete="current-password" required aria-describedby="login_pw_help">
              <button class="i_action" type="button" data-action="pw_toggle" aria-label="비밀번호 표시" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
            </div>
            <span class="i_help" id="login_pw_help"></span>
          </div>
          <label class="check"><input class="i_input" type="checkbox" name="remember"><span>로그인 상태 유지</span></label>
          <button class="btn m_primary m_large m_full" type="submit">로그인</button>
        </form>

        <div class="p_divider"><span>또는</span></div>
        <div class="p_social">
          <button class="btn m_large m_full" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10zM2 12h20"></path></svg>Google로 계속</button>
          <button class="btn m_large m_full" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 22v-4a4 4 0 0 0-1-3c3 0 6-2 6-5.5a4.6 4.6 0 0 0-1-3.5 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2 4.6 4.6 0 0 0-1 3.5c0 3.5 3 5.5 6 5.5a4 4 0 0 0-1 3v4"></path></svg>GitHub로 계속</button>
        </div>
        <p class="p_signup">계정이 없으신가요? <a href="#">회원가입</a></p>
      </div>
    </div>
  </main>

  <footer class="l_foot"><a href="#">이용약관</a><a href="#">개인정보처리방침</a><span>© 2026 SLUR</span></footer>
</div>

<!-- 토스트 컨테이너 — 라이브 영역은 미리 DOM에 -->
<div class="toast_message" role="status" data-state="close"><p class="i_text"></p><button type="button" class="i_close" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button></div>

<script>
// 페이지 스크립트 — 검증·제출 흐름만. 위젯 동작(토스트·테마)은 slur.js
const form = document.querySelector('.page_login .p_form');
const alertBox = document.querySelector('.page_login .alert');
const fields = {
  email: { input: document.getElementById('login_email'), help: document.getElementById('login_email_help') },
  password: { input: document.getElementById('login_pw'), help: document.getElementById('login_pw_help') }
};

// 오류는 field의 data-state + i_help 문장 + aria-invalid. 풀리면 셋 다 되돌린다
function setError(key, message) {
  const { input, help } = fields[key];
  input.closest('.field').dataset.state = message ? 'error' : '';
  input.setAttribute('aria-invalid', message ? 'true' : 'false');
  help.textContent = message || '';
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action="pw_toggle"]');
  if (!btn) return;
  const input = fields.password.input, show = input.type === 'password';
  input.type = show ? 'text' : 'password';
  btn.setAttribute('aria-pressed', String(show));
  btn.setAttribute('aria-label', show ? '비밀번호 숨기기' : '비밀번호 표시');
});

form.addEventListener('input', (e) => { const key = e.target.name; if (fields[key]) setError(key, ''); alertBox.dataset.state = 'close'; });

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = fields.email.input.value.trim(), pw = fields.password.input.value;
  let firstInvalid = null;
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setError('email', '올바른 이메일 주소를 입력하세요.'); firstInvalid ??= fields.email.input; } else setError('email', '');
  if (pw.length < 8) { setError('password', '비밀번호는 8자 이상입니다.'); firstInvalid ??= fields.password.input; } else setError('password', '');
  if (firstInvalid) { firstInvalid.focus(); return; }   // 포커스는 첫 오류 필드로 — 인라인 오류는 그 자리에서

  const submit = form.querySelector('[type="submit"]');
  submit.dataset.state = 'loading'; submit.disabled = true;
  submit.innerHTML = '<span class="spinner" aria-hidden="true"></span>로그인 중…';
  await new Promise((r) => setTimeout(r, 900));   // 데모 — 실제로는 fetch
  submit.dataset.state = ''; submit.disabled = false; submit.textContent = '로그인';

  if (email === 'demo@slur.co.kr' && pw === 'password') { slur.toast('로그인되었습니다. (데모 — 실제로는 대시보드로 이동)'); }
  else { alertBox.dataset.state = 'show'; fields.password.input.focus(); }
});
</script>
</body>
</html>
